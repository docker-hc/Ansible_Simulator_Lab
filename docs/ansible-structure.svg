<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'DejaVu Sans Mono',monospace">
  <defs>
    <style>
      .bg{fill:#020a0f}
      .eyebrow{fill:#00c8f0;font-size:11px;font-weight:bold;letter-spacing:2px}
      .sub{fill:#4a7a95;font-size:10px}
      .panel{fill:#060f16;stroke:#0d3550;stroke-width:1.5}
      .ph{fill:#00c8f0;font-size:12px;font-weight:bold}
      .dir{fill:#00c8f0;font-size:12px}
      .file{fill:#b8d8e8;font-size:12px}
      .cmt{fill:#4a7a95;font-size:10px;font-style:italic}
      .grp{fill:#00e8a0;font-size:12px;font-weight:bold}
      .hst{fill:#b8d8e8;font-size:11px}
      .gip{fill:#005f75;font-size:10px}
      .tline{stroke:#0d3550;stroke-width:1}
      .gline{stroke:#006644;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="820"/>
  <text class="eyebrow" x="40" y="42">▸ ANSIBLE PROJECT STRUCTURE &amp; INVENTORY GRAPH</text>
  <text class="sub" x="40" y="62">/etc/ansible/Ansible_Simulator_Lab — generated by scripts/show-structure.sh</text>

  <!-- LEFT: directory tree -->
  <rect class="panel" x="30" y="80" width="560" height="710" rx="8"/>
  <text class="ph" x="48" y="106">DIRECTORY TREE</text>

  <!-- tree lines -->
  <g font-size="12">
    <text class="dir" x="48" y="134">Ansible_Simulator_Lab/</text>
    <text class="file" x="68" y="156">├─ ansible.cfg          <tspan class="cmt">inventory · vault · roles_path</tspan></text>
    <text class="file" x="68" y="178">├─ .ansible-lint        <tspan class="cmt">excludes vendor playbooks</tspan></text>
    <text class="file" x="68" y="200">├─ .yamllint.yml</text>
    <text class="file" x="68" y="222">├─ .gitignore           <tspan class="cmt">exports/</tspan></text>
    <text class="file" x="68" y="244">├─ inventory            <tspan class="cmt">groups + lab:children</tspan></text>
    <text class="dir"  x="68" y="266">├─ group_vars/</text>
    <text class="file" x="92" y="288">│   ├─ controller.yml   <tspan class="cmt">horcm_instances</tspan></text>
    <text class="file" x="92" y="310">│   └─ vault.yml        <tspan class="cmt">$ANSIBLE_VAULT · vault_arrays</tspan></text>
    <text class="dir"  x="68" y="332">├─ host_vars/           <tspan class="cmt">per-sim: ip · serial · horcm</tspan></text>
    <text class="dir"  x="68" y="354">├─ roles/</text>
    <text class="file" x="92" y="376">│   ├─ cci/             <tspan class="cmt">HORCM config + start</tspan></text>
    <text class="file" x="92" y="398">│   └─ storage-sim/     <tspan class="cmt">iSCSI · WWN files</tspan></text>
    <text class="dir"  x="68" y="420">├─ playbooks/</text>
    <text class="file" x="92" y="442">│   ├─ 01-verify-lab.yml … 07-vsp-facts.yml</text>
    <text class="file" x="92" y="464">│   ├─ 08-export-facts.yml  <tspan class="cmt">facts → JSON</tspan></text>
    <text class="dir"  x="92" y="486">│   ├─ vsp_direct/      <tspan class="cmt">60+ vendor examples</tspan></text>
    <text class="dir"  x="92" y="508">│   └─ ansible_vault_vars/</text>
    <text class="dir"  x="68" y="530">├─ scripts/</text>
    <text class="file" x="92" y="552">│   ├─ lint-check.sh         <tspan class="cmt">7 checks</tspan></text>
    <text class="file" x="92" y="574">│   ├─ show-structure.sh     <tspan class="cmt">this grapher</tspan></text>
    <text class="file" x="92" y="596">│   ├─ run-facts-export.sh   <tspan class="cmt">pipeline</tspan></text>
    <text class="file" x="92" y="618">│   ├─ facts_to_xlsx.py      <tspan class="cmt">workbook + diff</tspan></text>
    <text class="file" x="92" y="640">│   ├─ facts_to_csv.py</text>
    <text class="file" x="92" y="662">│   └─ gather_hba_wwn.py     <tspan class="cmt">raidcom WWN logins</tspan></text>
    <text class="dir"  x="68" y="684">├─ exports/             <tspan class="cmt">git-ignored output</tspan></text>
    <text class="file" x="92" y="706">│   ├─ raw/  csv/  history/</text>
    <text class="file" x="92" y="728">│   └─ vsp_facts_&lt;date&gt;.xlsx</text>
    <text class="file" x="68" y="750">└─ collections (~/.ansible)  <tspan class="cmt">vspone_block 4.8.1</tspan></text>
  </g>

  <!-- RIGHT: inventory graph -->
  <rect class="panel" x="610" y="80" width="460" height="430" rx="8"/>
  <text class="ph" x="628" y="106">INVENTORY GRAPH — ansible-inventory --graph</text>

  <!-- @all -->
  <text class="grp" x="628" y="140">@all:</text>
  <text class="grp" x="648" y="166">└─@lab:</text>

  <!-- controller -->
  <text class="grp" x="676" y="196">├─@controller:</text>
  <text class="hst" x="710" y="218">rocky9-ansible-mgmt</text>
  <text class="gip" x="710" y="234">(CCI/HORCM host)</text>

  <!-- simulator -->
  <text class="grp" x="676" y="262">├─@simulator:</text>
  <text class="hst" x="710" y="284">rocky9-sim-810294 · 840006</text>
  <text class="hst" x="710" y="302">rocky9-sim-845665 · 845666</text>

  <!-- nodes -->
  <text class="grp" x="676" y="330">├─@nodes:</text>
  <text class="hst" x="710" y="352">rhel-dkc-node1 · node2</text>

  <!-- mgmt -->
  <text class="grp" x="676" y="380">└─@mgmt:</text>
  <text class="hst" x="710" y="402">rocky9-ansible-mgmt</text>

  <text class="sub" x="628" y="440">vars resolve: group_vars/&lt;group&gt;.yml + host_vars/&lt;host&gt;.yml</text>
  <text class="sub" x="628" y="458">vault_arrays (vault.yml) drives facts + export loops</text>
  <text class="sub" x="628" y="476">become: False · remote_user root · key /root/.ssh/ansible</text>

  <!-- facts pipeline panel -->
  <rect class="panel" x="610" y="530" width="460" height="260" rx="8"/>
  <text class="ph" x="628" y="556">FACTS-EXPORT PIPELINE</text>
  <text class="file" x="628" y="584">run-facts-export.sh</text>
  <text class="cmt" x="628" y="604">  1 ▸ ansible-playbook 08-export-facts.yml</text>
  <text class="cmt" x="628" y="622">      └ 6 module facts + gather_hba_wwn.py</text>
  <text class="cmt" x="628" y="640">          → exports/raw/*.json</text>
  <text class="cmt" x="628" y="660">  2 ▸ facts_to_xlsx.py  (diff vs history)</text>
  <text class="cmt" x="628" y="678">      → Summary · Changes · per-array</text>
  <text class="cmt" x="628" y="696">        · All-&lt;fact&gt; · All-HBA-WWNs</text>
  <text class="cmt" x="628" y="714">  3 ▸ facts_to_csv.py → exports/csv/*.csv</text>
  <text class="cmt" x="628" y="732">  4 ▸ archive raw → exports/history/&lt;ts&gt;</text>
  <text class="cmt" x="628" y="750">  5 ▸ copy xlsx+csv → /mnt/vm_share</text>
  <text class="sub" x="628" y="774">green = added · amber = changed/empty-HG · red = removed</text>
</svg>

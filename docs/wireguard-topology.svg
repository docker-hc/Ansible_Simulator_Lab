<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="'DejaVu Sans Mono',monospace">
  <defs>
    <style>
      .bg{fill:#0d0805}
      .card{fill:#14100a;stroke:#3a2c14;stroke-width:1.5}
      .remote{stroke:#ff9d4d;stroke-width:2}
      .inet{stroke:#5e8a73;stroke-width:1.5}
      .router{stroke:#f0c040;stroke-width:1.5}
      .mgmt{stroke:#ff9d4d;stroke-width:2}
      .lab{stroke:#00c8f0;stroke-width:1.5}
      .title{fill:#fff;font-size:14px;font-weight:bold}
      .sub{fill:#8a7a5e;font-size:10px}
      .ip{fill:#ff9d4d;font-size:10px}
      .ipc{fill:#00c8f0;font-size:10px}
      .lbl{fill:#d8c8a8;font-size:10px}
      .eyebrow{fill:#ff9d4d;font-size:11px;font-weight:bold;letter-spacing:2px}
      .tun{stroke:#ff9d4d;stroke-width:2.5;stroke-dasharray:7 4;fill:none}
      .wire{stroke:#3a2c14;stroke-width:1.5;fill:none}
      .tunlbl{fill:#ff9d4d;font-size:10px;font-weight:bold}
      .pill{fill:#1a1308;stroke:#ff9d4d;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="560"/>
  <text class="eyebrow" x="40" y="40">&#9656; WIREGUARD REMOTE ACCESS &#8212; TUNNEL PATH</text>
  <text class="sub" x="40" y="60">Split-tunnel from any location &#8594; home router &#8594; mgmt node gateway &#8594; full 192.168.2.0/24 lab</text>

  <!-- Remote laptop -->
  <rect class="card remote" x="40" y="110" width="190" height="150" rx="10"/>
  <text class="title" x="58" y="138">Remote laptop</text>
  <text class="sub" x="58" y="156">any network, any local IP</text>
  <text class="lbl" x="58" y="182">WireGuard client</text>
  <text class="ip" x="58" y="202">tun 10.99.99.2/24</text>
  <text class="sub" x="58" y="224">AllowedIPs:</text>
  <text class="ipc" x="58" y="242">192.168.2.0/24 +</text>
  <text class="ip" x="58" y="258">10.99.99.0/24</text>

  <!-- Internet cloud -->
  <ellipse class="card inet" cx="400" cy="185" rx="90" ry="55"/>
  <text class="title" x="362" y="180" fill="#8fb8a4">Internet</text>
  <text class="sub" x="350" y="200">UDP 51822 only</text>

  <!-- Home router -->
  <rect class="card router" x="560" y="120" width="180" height="130" rx="10"/>
  <text class="title" x="578" y="148">Home router</text>
  <text class="sub" x="578" y="166">you control it</text>
  <text class="lbl" x="578" y="190">port-forward</text>
  <text class="lbl" x="578" y="208" fill="#f0c040">UDP 51822 &#8594;</text>
  <text class="ip" x="578" y="226">192.168.2.91</text>
  <text class="sub" x="578" y="244">+ dyn-DNS name</text>

  <!-- Mgmt node gateway -->
  <rect class="card mgmt" x="820" y="100" width="240" height="170" rx="10"/>
  <text class="title" x="838" y="128">Mgmt node &#8212; VPN gateway</text>
  <text class="sub" x="838" y="146">Rocky 9 &#183; wg0 + IP forward</text>
  <text class="ip" x="838" y="170">tun 10.99.99.1/24</text>
  <text class="ipc" x="838" y="188">lan 192.168.2.91</text>
  <text class="lbl" x="838" y="212">MASQUERADE</text>
  <text class="sub" x="838" y="230">tunnel &#8594; lab LAN,</text>
  <text class="sub" x="838" y="246">so no per-array routes</text>
  <text class="sub" x="838" y="262">needed</text>

  <!-- Lab subnet box -->
  <rect class="card lab" x="820" y="300" width="240" height="220" rx="10"/>
  <text class="title" x="838" y="328" fill="#00c8f0">Lab &#8212; 192.168.2.0/24</text>
  <text class="ipc" x="838" y="352">.90  sim 810294 (REST)</text>
  <text class="ipc" x="838" y="372">.93  sim 840006 (REST)</text>
  <text class="ipc" x="838" y="392">.92  sim 845665 (REST)</text>
  <text class="ipc" x="838" y="412">.94  sim 845666 (REST)</text>
  <text class="lbl" x="838" y="438">.91:8080  SAM4H UI</text>
  <text class="lbl" x="838" y="458">.91:9090  Cockpit</text>
  <text class="lbl" x="838" y="478">.91       SSH / HORCM</text>
  <text class="sub" x="838" y="500">reachable in browser remotely</text>

  <!-- wires -->
  <line class="wire" x1="230" y1="185" x2="310" y2="185"/>
  <line class="wire" x1="490" y1="185" x2="560" y2="185"/>
  <line class="wire" x1="740" y1="185" x2="820" y2="185"/>
  <line class="wire" x1="940" y1="270" x2="940" y2="300"/>

  <!-- encrypted tunnel overlay -->
  <path class="tun" d="M 135 110 C 135 60, 940 50, 940 100"/>
  <rect class="pill" x="470" y="38" width="200" height="22" rx="11"/>
  <text class="tunlbl" x="486" y="53">encrypted WireGuard tunnel</text>

  <!-- legend -->
  <line class="tun" x1="60" y1="320" x2="110" y2="320"/>
  <text class="lbl" x="120" y="324">encrypted tunnel (10.99.99.0/24)</text>
  <line class="wire" x1="60" y1="345" x2="110" y2="345"/>
  <text class="lbl" x="120" y="349">physical / internet path</text>
  <text class="sub" x="60" y="392">Only UDP 51822 is exposed to the internet. WireGuard does not</text>
  <text class="sub" x="60" y="408">respond to unauthenticated probes &#8212; silent to port scans.</text>
  <text class="sub" x="60" y="428">SAM4H / Cockpit / array UIs stay behind the tunnel, never</text>
  <text class="sub" x="60" y="444">port-forwarded directly.</text>
  <text class="sub" x="60" y="478">Tunnel range 10.99.99.0/24 is deliberately exotic so it never</text>
  <text class="sub" x="60" y="494">collides with the local IP range of wherever you connect from.</text>
</svg>

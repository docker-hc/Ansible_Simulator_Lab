---
# CCI / Raidcom installation paths
horcm_install_path: /HORCM
horcm_bin: /HORCM/usr/bin

# HORCM instance configuration
horcm_instances:
  - instance: 0
    port: 31000
    poll_interval: 1000
    timeout: 3000

# IP Command Device
# SAM4H (192.168.2.91) reaches HORCM via the controller bridged IP
ip_command_device:
  type: ip
  array_ip: "{{ vault_array_ip }}"
  array_serial: "{{ vault_array_serial }}"
  instance: 0
  port: 31000
  local_ip: 192.168.2.90        # bridged IP — must be reachable by SAM4H

# Offline local RPM repository
local_repo_path: /opt/localrepo
local_repo_url: http://192.168.56.11/localrepo

# Raidcom credentials (stored in vault)
raidcom_user: "{{ vault_raidcom_user }}"
raidcom_password: "{{ vault_raidcom_password }}"

# HORCM config file
horcm_conf_file: /etc/horcm0.conf

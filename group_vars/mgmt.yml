---
# SAM4H service
sam4h_install_path: /opt/hitachi/sam4h
sam4h_service: sam4h.service
sam4h_port: 8080
sam4h_compose_file: /opt/hitachi/sam4h/config/docker-compose.yml

# Expected running containers
podman_containers:
  - config-sam4h-1
  - config-db-1
  - config-elasticsearch-1
  - config-redis-1

# Cockpit proxy URLs — access all lab hosts through mgmt node
# No cockpit-dashboard package needed on RHEL 10 Cockpit 334+
cockpit_proxy_urls:
  controller: "https://192.168.2.91:9090/=192.168.56.12"
  node1: "https://192.168.2.91:9090/=192.168.56.21"
  node2: "https://192.168.2.91:9090/=192.168.56.22"

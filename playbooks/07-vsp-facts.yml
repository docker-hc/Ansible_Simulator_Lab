---
- name: Gather VSP One Block storage facts
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/vault.yml
  tasks:
    - name: Get parity group facts for each array
      hitachivantara.vspone_block.vsp.hv_paritygroup_facts:
        connection_info:
          connection_type: "direct"
          address: "{{ item.controller_ip_0 }}"
          username: "{{ vault_raidcom_user }}"
          password: "{{ vault_raidcom_password }}"
      register: vsp_pg_facts
      loop: "{{ vault_arrays }}"

    - name: Get LDEV facts for each array
      hitachivantara.vspone_block.vsp.hv_ldev_facts:
        connection_info:
          connection_type: "direct"
          address: "{{ item.controller_ip_0 }}"
          username: "{{ vault_raidcom_user }}"
          password: "{{ vault_raidcom_password }}"
      register: vsp_ldev_facts
      loop: "{{ vault_arrays }}"

    - name: Get host group facts for each array
      hitachivantara.vspone_block.vsp.hv_hg_facts:
        connection_info:
          connection_type: "direct"
          address: "{{ item.controller_ip_0 }}"
          username: "{{ vault_raidcom_user }}"
          password: "{{ vault_raidcom_password }}"
      register: vsp_hg_facts
      loop: "{{ vault_arrays }}"

    - name: Show parity group results
      ansible.builtin.debug:
        msg: "Array {{ item.item.serial }} — Parity Groups: {{ item.parityGroups | default([]) | length }}"
      loop: "{{ vsp_pg_facts.results }}"

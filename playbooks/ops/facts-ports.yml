---
# playbooks/ops/facts-ports.yml
# List storage ports on an array (FC/iSCSI, topology, attributes).
# Usage: ansible-playbook playbooks/ops/facts-ports.yml -e target_serial=810294
- name: Report storage ports on an array
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../group_vars/vault.yml
  vars:
    target_serial: ""
  tasks:
    - name: Require target_serial
      ansible.builtin.assert:
        that: target_serial | length > 0
        fail_msg: "Pass -e target_serial=<serial>"

    - name: "Resolve connection · {{ target_serial }}"
      ansible.builtin.set_fact:
        array_conn:
          address: "{{ (vault_arrays | selectattr('serial', 'equalto', target_serial) | first).controller_ip_0 }}"
          username: "{{ vault_raidcom_user }}"
          password: "{{ vault_raidcom_password }}"

    - name: "Gather storage port facts · {{ target_serial }}"
      hitachivantara.vspone_block.vsp.hv_storage_port_facts:
        connection_info: "{{ array_conn }}"
      register: ports_facts

    - name: "Show ports · {{ target_serial }}"
      ansible.builtin.debug:
        var: ports_facts

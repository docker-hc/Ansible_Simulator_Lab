---
- name: Verify CCI is installed
  ansible.builtin.stat:
    path: "{{ cci_raidcom_bin }}"
  register: cci_raidcom_stat
  failed_when: not cci_raidcom_stat.stat.exists

- name: Generate HORCM config file
  ansible.builtin.template:
    src: horcm.conf.j2
    dest: "{{ cci_horcm_conf_file }}"
    mode: '0644'
    backup: true
  notify: Restart horcm

- name: Check if HORCM instance is already running
  ansible.builtin.command: "{{ cci_raidcom_bin }} get system -IH{{ cci_horcm_instance }}"
  register: cci_horcm_running
  changed_when: false
  failed_when: false

- name: Start HORCM instance {{ cci_horcm_instance }}
  ansible.builtin.command: "{{ cci_horcm_start_script }} {{ cci_horcm_instance }}"
  when: cci_horcm_running.rc != 0
  register: cci_horcm_start
  failed_when:
    - cci_horcm_start.rc != 0
    - "'already running' not in cci_horcm_start.stdout"

- name: Verify raidcom can reach array via IP command device
  ansible.builtin.command: "{{ cci_raidcom_bin }} get system -IH{{ cci_horcm_instance }}"
  register: cci_array_info
  changed_when: false
  retries: 3
  delay: 5

- name: Show array system info
  ansible.builtin.debug:
    msg: "{{ cci_array_info.stdout_lines }}"

- name: Open HORCM UDP port in firewall
  ansible.posix.firewalld:
    port: "{{ cci_horcm_port }}/udp"
    permanent: true
    state: enabled
    immediate: true

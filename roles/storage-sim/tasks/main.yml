---
- name: Install iSCSI initiator utils
  yum:
    name: iscsi-initiator-utils
    state: present

- name: Enable and start iscsid
  systemd:
    name: iscsid
    state: started
    enabled: true

- name: Write simulated WWN identity file
  copy:
    dest: "{{ sim_wwn_file }}"
    content: |
      # SAM4H simulated host identity
      # Generated by Ansible — do not edit manually
      NODE={{ inventory_hostname }}
      WWN_FA={{ wwn_a }}
      WWN_FB={{ wwn_b }}
    mode: '0644'

- name: Read iSCSI initiator IQN
  command: cat /etc/iscsi/initiatorname.iscsi
  register: iqn
  changed_when: false

- name: Show node storage identity
  debug:
    msg:
      - "Host:        {{ inventory_hostname }}"
      - "WWN Fabric-A: {{ wwn_a }}"
      - "WWN Fabric-B: {{ wwn_b }}"
      - "iSCSI IQN:   {{ iqn.stdout }}"
